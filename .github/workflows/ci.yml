name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # Integration tests (require live Postgres) are excluded by default
        # via pyproject.toml addopts = "-m 'not integration'"
        run: pytest --tb=short -q
