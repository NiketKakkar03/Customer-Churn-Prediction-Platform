global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI serving layer — runs as a Docker Compose service
  - job_name: churn_api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # Orchestrator + drift monitor push metrics here after each nightly run
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
